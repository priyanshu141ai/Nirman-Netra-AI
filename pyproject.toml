[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nirman-netra"
version = "0.1.0"
description = "Geospatial municipal inspection decision-support foundation"
requires-python = ">=3.11"
dependencies = [
  "affine>=2.4,<3",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.11,<5",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=20,<25",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.1,<3",
  "streamlit>=1.47,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
generate-synthetic = "nirman_netra.data.cli:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<2",
  "pre-commit>=4.2,<5",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nirman_netra"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["streamlit"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["affine", "rasterio", "rasterio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "nirman_netra.imagery.alignment",
  "nirman_netra.imagery.quality",
  "nirman_netra.imagery.raster",
  "nirman_netra.persistence.registration",
]
disallow_untyped_calls = false
